name: Build and push HA add-on image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from config.yaml
        id: meta
        run: |
          echo "version=$(grep '^version:' ha-addon/config.yaml | awk '{print $2}' | tr -d '\"')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ha-addon/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/xavixma/ems:latest
            ghcr.io/xavixma/ems:${{ steps.meta.outputs.version }}
            ghcr.io/xavixma/ems:aarch64-${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
