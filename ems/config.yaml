name: "EMS - Energy Management System"
version: "1.0.10"
slug: "ems"
description: "Gestió energètica per solar Hoymiles i carregador EV Wallbox Pulsar Max"
url: "https://github.com/xavixma/ems"
arch:
  - aarch64
  - amd64
image: "ghcr.io/xavixma/ems-{arch}"
startup: application
boot: auto
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "EMS REST API"
ingress: true
ingress_port: 8000
panel_icon: mdi:solar-power
panel_title: "EMS Solar"
options:
  hoymiles_dtu_ip: "192.168.3.96"
  wallbox_charger_id: ""
  wallbox_email: ""
  wallbox_password: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: "ems"
  mqtt_password: ""
  influxdb_host: "a0d7b954-influxdb"
  influxdb_port: 8086
  influxdb_database: "ems"
  influxdb_username: ""
  influxdb_password: ""
  ems_default_mode: "manual"
  ems_threshold_on_w: 1400
  ems_threshold_off_w: 500
  ems_histeresi_minuts: 5
  ems_voltage: 230
  ems_phases: 3
  ems_poll_interval_s: 30
schema:
  hoymiles_dtu_ip: "str"
  wallbox_charger_id: "str"
  wallbox_email: "str"
  wallbox_password: "password"
  mqtt_host: "str"
  mqtt_port: "port"
  mqtt_username: "str"
  mqtt_password: "password"
  influxdb_host: "str?"
  influxdb_port: "port?"
  influxdb_database: "str?"
  influxdb_username: "str?"
  influxdb_password: "password?"
  ems_default_mode: "list(manual|auto|eco)"
  ems_threshold_on_w: "int"
  ems_threshold_off_w: "int"
  ems_histeresi_minuts: "int"
  ems_voltage: "int"
  ems_phases: "int"
  ems_poll_interval_s: "int"